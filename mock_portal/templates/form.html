<!DOCTYPE html>
<html>
<head>
    <title>Apply - {{ job.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7fa; }
        .form-container { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 form-container">
                <h3 class="mb-4">Applying for <span class="text-primary">{{ job.title }}</span></h3>
                <form action="/submit" method="post">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Skills (comma separated)</label>
                        <input type="text" class="form-control" id="skills" name="skills">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cover Letter</label>
                        <textarea class="form-control" id="cover_letter" name="cover_letter" rows="4"></textarea>
                    </div>
                    <button type="submit" id="submit_btn" class="btn btn-primary w-100">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
